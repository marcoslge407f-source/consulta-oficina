<script>

/* ---------- utilitários ---------- */
const $=s=>document.querySelector(s);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const pad=n=>String(n).padStart(2,'0');
const hoje=(d=new Date())=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const agoraHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const toMin=hm=>{if(!hm)return null;const[h,m]=hm.split(':').map(Number);return h*60+m};
const fmt=m=>{m=Math.max(0,Math.round(m||0));return pad(Math.floor(m/60))+':'+pad(m%60)};
const dur=(a,b)=>{const x=toMin(a),y=toMin(b);if(x==null||y==null)return 0;return y>=x?y-x:y+1440-x};
const decorrido=ini=>{const m=dur(ini,agoraHM());return m>960?0:m};
const somaHM=(hm,min)=>{const m=(toMin(hm)+min+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60)};
const dataBR=iso=>iso?iso.split('-').reverse().join('/'):'';
const addDias=(iso,n)=>{const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return hoje(d)};
const up=s=>(s??'').toString().trim().toUpperCase();
const esc=s=>(s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uuid=()=>crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c=='x'?r:(r&3|8)).toString(16)});
const horaDe=iso=>{if(!iso)return'';const d=new Date(iso);return pad(d.getHours())+':'+pad(d.getMinutes())};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.remove('oculto');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('oculto'),2800)}
async function hash(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function faixa(p){return p<67?['RUIM','#D32F2F']:p<83?['BOM','#F2A900']:['ÓTIMO','#2E9D4A']}

aplicarTema();window.addEventListener('storage',aplicarTema);window.addEventListener('message',e=>{if(e.data==='tema')aplicarTema()});

/* ---------- servidor ---------- */
class ErroRede extends Error{}
/* contador de tráfego (estimativa do que sai do Supabase) */
const TRF_M='trf_pend_m';
function contaTrf(t){try{const n=(()=>{try{return new TextEncoder().encode(t).length}catch(e){return(t||'').length}})()+400,p=JSON.parse(localStorage.getItem(TRF_M)||'{"b":0,"n":0}');p.b+=n;p.n++;localStorage.setItem(TRF_M,JSON.stringify(p))}catch(e){}}
let trfE=false;
async function enviarTrf(){if(trfE)return;let p;try{p=JSON.parse(localStorage.getItem(TRF_M)||'null')}catch(e){return}if(!p||(!p.b&&!p.n))return;trfE=true;
  try{const r=await fetch(SB_URL+'/rest/v1/rpc/trafego_somar',{method:'POST',keepalive:true,headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({p_origem:'APP MECÂNICO',p_bytes:p.b,p_req:p.n})});
    if(r.ok){const q=JSON.parse(localStorage.getItem(TRF_M)||'{"b":0,"n":0}');q.b=Math.max(0,q.b-p.b);q.n=Math.max(0,q.n-p.n);localStorage.setItem(TRF_M,JSON.stringify(q))}}catch(e){}trfE=false}
setInterval(enviarTrf,60000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')enviarTrf()});
async function rpc(nome,params){
  let r;const ac=new AbortController(),to=setTimeout(()=>ac.abort(),25000);try{r=await fetch(SB_URL+'/rest/v1/rpc/'+nome,{method:'POST',signal:ac.signal,cache:'no-store',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(params)})}catch(e){throw new ErroRede('SEM CONEXÃO')}finally{clearTimeout(to)}
  if(r.status>=500||r.status===408||r.status===429)throw new ErroRede('SERVIDOR INDISPONÍVEL');
  const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
  if(r.ok)contaTrf(t);
  if(!r.ok)throw new Error((j&&(j.message||j.hint))||('ERRO '+r.status));return j;
}
const MSG={LOGIN_INVALIDO:'SENHA INCORRETA',SESSAO_INVALIDA:'SESSÃO EXPIRADA — ENTRE NOVAMENTE',SENHA_4_DIGITOS:'A SENHA DEVE TER 4 NÚMEROS',SENHA_0000:'A NOVA SENHA NÃO PODE SER 0000'};
const traduz=e=>{const k=Object.keys(MSG).find(k=>(e.message||'').includes(k));return k?MSG[k]:(e.message||'ERRO')};

/* ---------- dados ---------- */
let U=LS.get('mc_sess',null), ITENS=[], JORN=[], JSEL=null, ATIV=LS.get('mc_ativ',[]), FROTAS=LS.get('mc_frotas',[]);
const kI=()=>'mc_itens_'+U.id, kJ=()=>'mc_jorn_'+U.id;

const jAberta=()=>{const j=jSel();return j&&j.status==='ABERTA'?j:null};
const frotasAtivas=()=>FROTAS.filter(f=>f.na_planilha!==false&&(f.situacao||'ATIVO')==='ATIVO');
const descFrota=f=>[f.subclasse||f.classe,f.modelo].filter(Boolean).join(' · ');
async function carregarListas(){
  try{const a=await rpc('listar_atividades',{});if(a&&a.length){ATIV=a;LS.set('mc_ativ',a)}}catch(e){}
  try{const f=await rpc('listar_frotas',{});if(f){FROTAS=f;LS.set('mc_frotas',f)}}catch(e){}
}

/* ---------- ordem dos horários (turno que vira a noite) ---------- */
let REF=300;
// REF = minuto a partir do qual o horário é do PRÓPRIO dia da jornada; horários antes do REF são da madrugada seguinte (turno noturno).
function refAbertura(j){if(!j||!j.aberta_em)return 0;
  const min=Math.round((new Date(j.aberta_em)-new Date(j.data+'T00:00:00'))/60000);
  if(min<0||min>=2160)return 0;            // aberta antes do dia ou dias depois (lançamento atrasado): sem turno noturno presumido
  if(min>=1440)return 720;                  // aberta na madrugada/manhã seguinte: turno noturno, antes de 12:00 é do dia seguinte

function refDe(j){

function totais(l,run){const t={P:0,I:0,R:0,T:0};l.forEach(i=>{const m=i.fim?dur(i.inicio,i.fim):(run&&run.id===i.id?decorrido(i.inicio):0);if(i.categoria==='IMPRODUTIVO')t.I+=m;else t.P+=m;if(ehRefeicao(i))t.R+=m;t.T+=m});t.pc=t.T?Math.round(t.P/t.T*100):0;return t}
function tiles(t){const pc=v=>t.T?Math.round(v/t.T*100)+'%':'—',[fx,fc]=faixa(t.pc);
  return[['PRODUTIVO',fmt(t.P),pc(t.P),'#2E9D4A'],['IMPRODUTIVO',fmt(t.I),pc(t.I),'#D32F2F'],['REFEIÇÃO',fmt(t.R),'','#F2A900'],['TOTAL',fmt(t.T),'','#1565C0'],['ÍNDICE',t.T?t.pc+'%':'—',t.T?fx:'',fc]]
  .map(([l,v,p,c])=>`<div class="tile" style="border-top-color:${c}"><div class="l">${l}</div><div class="v" ${l==='ÍNDICE'?`style="color:${c}"`:''}>${v}</div><div class="p">${p}</div></div>`).join('')}
function lacunas(l){let n=0;for(let k=1;k<l.length;k++){const f=fimOrd(l[k-1]);if(f!==null&&ordem(l[k])>f)n++}return n}
function sobrep(l){const iv=l.filter(i=>i.fim).map(i=>{const a=ordem(i);return[a,a+dur(i.inicio,i.fim)]}).sort((a,b)=>a[0]-b[0]);let n=0;for(let k=1;k<iv.length;k++)if(iv[k][0]<iv[k-1][1])n++;return n}
function alertas(l){const a=[];if(!l.length)return a;if(!l.some(ehRefeicao))a.push(['am','⚠ REFEIÇÃO AINDA NÃO APONTADA']);const lc=lacunas(l);if(lc)a.push(['vm','⚠ '+lc+' INTERVALO(S) SEM APONTAMENTO']);const s=sobrep(l);if(s)a.push(['vm','⚠ '+s+' HORÁRIO(S) SOBREPOSTO(S)']);return a}

function excluirItem(id){
  const J=jAberta();const it=ITENS.find(i=>i.id===id);if(!it)return;
  if(!J||it.data!==J.data)return toast('JORNADA ENCERRADA — SOMENTE O ANALISTA PODE EXCLUIR');
  REF=refDe(J);const l=diaItens(it.data),k=l.findIndex(i=>i.id===id),pv=l[k-1],nx=l[k+1],meio=pv&&nx&&it.fim;
  const pvL=meio&&ehRefeicao(pv)&&dur(pv.inicio,nx.inicio)>REFEICAO_MAX,nxL=meio&&ehRefeicao(nx)&&nx.fim&&dur(it.inicio,nx.fim)>REFEICAO_MAX;
  if(pvL&&nxL)return toast('NÃO DÁ PARA EXCLUIR: A REFEIÇÃO PASSARIA DE 1 HORA. EDITE OS HORÁRIOS.');
  const txt=meio?(pvL?`EXCLUIR "${it.atividade}" (${it.inicio}–${it.fim})? "${nx.atividade}" PASSA A COMEÇAR ${it.inicio}.`:`EXCLUIR "${it.atividade}" (${it.inicio}–${it.fim})? "${pv.atividade}" PASSA A IR ATÉ ${nx.inicio}.`):`EXCLUIR "${it.atividade}" (${it.inicio}–${it.fim||'…'})?`;
  confirmar(txt,()=>{const arr=[];if(meio&&pvL)arr.push({...nx,inicio:it.inicio,periodo:periodoDaHora(it.inicio),minutos:nx.fim?dur(it.inicio,nx.fim):null});else if(meio)arr.push({...pv,fim:nx.inicio,minutos:dur(pv.inicio,nx.inicio)});
    arr.push({...it,excluido:true});fechar();gravarVarios(arr);toast('APONTAMENTO EXCLUÍDO')});
}
function confirmar(txt,ok){
  $('#modal').innerHTML=`<div class="fundo"><div class="modal"><h2>${esc(txt)}</h2><div class="lin" style="margin-top:12px"><button class="btn verm" id="cSim">SIM</button><button class="btn cinza" onclick="fechar()">NÃO</button></div></div></div>`;
  $('#cSim').onclick=()=>{fechar();ok()};
}

<!-- ===== MENUS DE ESCOLHA (substitui a lista padrão do celular) ===== -->
<style>
.selw{position:relative;display:block;min-width:0}
.selw>select{width:100%}
.selw>.selx{position:absolute;inset:0;cursor:pointer;border-radius:12px;-webkit-tap-highlight-color:transparent}
.selw.dis>.selx{display:none}
.selfd{position:fixed;inset:0;z-index:9999;background:rgba(15,23,32,.45);display:flex;align-items:flex-end;justify-content:center;animation:selfd .15s ease}
@keyframes selfd{from{opacity:0}to{opacity:1}}
@keyframes selsb{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.selpn{background:var(--card,#fff);color:var(--texto,#1C2733);width:100%;max-width:520px;max-height:78vh;border-radius:22px 22px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.18);display:flex;flex-direction:column;animation:selsb .18s ease;padding-bottom:env(safe-area-inset-bottom)}
@media (min-width:700px){.selfd{align-items:center}.selpn{border-radius:20px;max-height:70vh;width:440px}}
.selpn .selpg{width:40px;height:4px;border-radius:4px;background:var(--linha,#E3E8EE);margin:8px auto 2px}
.selpn .selcb{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 18px 10px}
.selpn .selcb b{font-size:12px;font-weight:900;letter-spacing:.6px;color:var(--azul,#1565C0)}
.selpn .selcb button{border:0;background:var(--fundo,#F4F7FA);color:var(--cinza,#6B7785);width:32px;height:32px;border-radius:50%;font-size:15px;font-weight:900;cursor:pointer}
.selpn .selbs{margin:0 16px 8px;border:1.5px solid var(--linha,#E3E8EE);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:700;background:var(--fundo,#F4F7FA);color:var(--texto,#1C2733);outline:none;text-transform:uppercase;font-family:inherit}
.selpn .selbs:focus{border-color:var(--azul,#1565C0)}
.selpn .sells{overflow-y:auto;padding:2px 10px 14px;scrollbar-width:none;-ms-overflow-style:none}
.selpn .sells::-webkit-scrollbar{display:none}
.selpn .selgr{font-size:10px;font-weight:900;color:var(--cinza,#6B7785);letter-spacing:.8px;padding:12px 10px 4px}
.selpn .selop{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;font-family:inherit;font-size:13px;font-weight:800;color:var(--texto,#1C2733);padding:11px 12px;border-radius:12px;cursor:pointer;text-transform:uppercase;line-height:1.3}
.selpn .selop:active{background:var(--fundo,#F4F7FA)}
@media (hover:hover){.selpn .selop:hover{background:var(--fundo,#F4F7FA)}}
.selpn .selop span{flex:1;min-width:0}
.selpn .selop i{font-style:normal;width:20px;height:20px;border-radius:50%;border:2px solid var(--linha,#E3E8EE);flex:0 0 20px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
.selpn .selop.on{background:rgba(21,101,192,.09);color:var(--azul,#1565C0)}
.selpn .selop.on i{background:var(--azul,#1565C0);border-color:var(--azul,#1565C0)}
.selpn .selct{font-style:normal;flex:0 0 auto;font-size:9.5px;font-weight:900;letter-spacing:.3px;padding:4px 8px;border-radius:20px}
.selpn .selct.p{background:#E3F4E7;color:#1B6B33}
.selpn .selct.i{background:#FDE7E7;color:#C62828}
.selpn .selop.vz{color:var(--cinza,#6B7785)}
.selpn .selop:disabled{opacity:.4;cursor:default}
.selpn .selnd{padding:18px;text-align:center;font-size:12px;font-weight:800;color:var(--cinza,#6B7785)}
</style>
<script>
(function () {
  const tituloDe = s => {
    if (s.dataset.titulo) return s.dataset.titulo;
    let p = s.closest('.selw') || s, a = p.previousElementSibling;
    if (a && (a.tagName === 'LABEL' || a.classList.contains('r'))) return a.textContent.trim();
    const f = s.closest('label'); if (f && f.querySelector('span')) return f.querySelector('span').textContent.trim();
    const o = s.options[0]; return o && o.value === '' ? o.textContent.trim().replace(/…$/, '') : 'ESCOLHA UMA OPÇÃO';
  };
  const escH = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function abrir(s) {
    if (s.disabled) return;
    const fd = document.createElement('div'); fd.className = 'selfd';
    const itens = []; let html = '';
    [...s.children].forEach(el => {
      const add = o => { itens.push(o); html += `<button type="button" class="selop${o.selected ? ' on' : ''}${o.value === '' ? ' vz' : ''}" data-k="${itens.length - 1}"${o.disabled ? ' disabled' : ''}><i>${o.selected ? '✓' : ''}</i><span>${escH(o.textContent)}</span>${o.dataset && o.dataset.cat === 'PRODUTIVO' ? '<em class="selct p">PRODUTIVO</em>' : o.dataset && o.dataset.cat === 'IMPRODUTIVO' ? '<em class="selct i">IMPRODUTIVO</em>' : ''}</button>`; };
      if (el.tagName === 'OPTGROUP') { html += `<div class="selgr" data-g>${escH(el.label)}</div>`; [...el.children].forEach(add); } else if (el.tagName === 'OPTION') add(el);
    });
    const busca = itens.length > 9;
    fd.innerHTML = `<div class="selpn" role="dialog"><div class="selpg"></div><div class="selcb"><b>${escH(tituloDe(s))}</b><button type="button" aria-label="FECHAR">✕</button></div>
      ${busca ? '<input class="selbs" placeholder="BUSCAR…" autocomplete="off">' : ''}<div class="sells">${html}<div class="selnd" style="display:none">NADA ENCONTRADO</div></div></div>`;
    document.body.appendChild(fd);
    const fechar = () => { fd.remove(); document.removeEventListener('keydown', esc); };
    const esc = e => { if (e.key === 'Escape') fechar(); };
    document.addEventListener('keydown', esc);
    fd.addEventListener('click', e => {
      if (e.target === fd || e.target.closest('.selcb button')) return fechar();
      const b = e.target.closest('.selop'); if (!b || b.disabled) return;
      const o = itens[+b.dataset.k]; fechar();
      if (s.value !== o.value || s.selectedIndex !== o.index) { s.selectedIndex = o.index; s.dispatchEvent(new Event('input', { bubbles: true })); s.dispatchEvent(new Event('change', { bubbles: true })); }
    });
    const on = fd.querySelector('.selop.on'); if (on) on.scrollIntoView({ block: 'center' });
    if (busca) {
      const inp = fd.querySelector('.selbs');
      inp.addEventListener('input', () => {
        const q = inp.value.trim().toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); let n = 0;
        fd.querySelectorAll('.selop').forEach(b => { const v = !q || b.textContent.toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, '').includes(q); b.style.display = v ? '' : 'none'; if (v) n++; });
        fd.querySelectorAll('[data-g]').forEach(g => { g.style.display = q ? 'none' : ''; });
        fd.querySelector('.selnd').style.display = n ? 'none' : '';
      });
      if (matchMedia('(hover:hover)').matches) setTimeout(() => inp.focus(), 50);
    }
  }
  function melhorar(s) {
    if (s.multiple || s.dataset.selok || s.closest('.selw')) return;
    s.dataset.selok = '1';
    const w = document.createElement('span'); w.className = 'selw';
    s.parentNode.insertBefore(w, s); w.appendChild(s);
    const x = document.createElement('span'); x.className = 'selx'; x.setAttribute('role', 'button'); x.tabIndex = -1;
    x.addEventListener('click', e => { e.preventDefault(); abrir(s); });
    w.appendChild(x);
    const sync = () => w.classList.toggle('dis', s.disabled); sync();
    new MutationObserver(sync).observe(s, { attributes: true, attributeFilter: ['disabled'] });
    s.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowDown') { e.preventDefault(); abrir(s); } });
  }
  const varrer = () => document.querySelectorAll('select').forEach(melhorar);
  let pend = false;
  new MutationObserver(() => { if (!pend) { pend = true; requestAnimationFrame(() => { pend = false; varrer(); }); } }).observe(document.documentElement, { childList: true, subtree: true });
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', varrer); else varrer();
})();
</script>
